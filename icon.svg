<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4262ff"/>
      <stop offset="100%" stop-color="#253cb8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Math Symbol (Square root of x) -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <!-- Square Root Symbol -->
    <path d="M 100 290 L 140 290 L 195 400 L 265 140 L 415 140" stroke-width="32"/>
    
    <!-- Under-root x variable -->
    <path d="M 310 260 L 375 355" stroke-width="30"/>
    <path d="M 375 260 L 310 355" stroke-width="30"/>
  </g>

  <!-- Small stylish accent dots -->
  <circle cx="430" cy="140" r="14" fill="#93c5fd"/>
  <circle cx="100" cy="290" r="14" fill="#93c5fd"/>
</svg>
